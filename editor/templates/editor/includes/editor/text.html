{% load static %}
<div class="container-fluid py-2" id="text_editor" style="display:none;">

    <!-- type -->
    <div class="mb-2">
        <label for="type" class="form-label text-light" style="user-select:none;">Type</label>
        <input class="form-control" id="type" type="text" value="Text" readonly>
    </div>

    
    <!-- text -->
    <div class="mb-2">
        <label for="text" class="form-label text-light" style="user-select:none;">Text</label>
        <input class="form-control" id="text" type="text">
    </div>

    
    <!-- visible -->
    <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="visible">
        <label class="form-check-label text-light" for="visible" style="user-select:none;">Visible</label>
    </div>

    
    
    <!-- delete button -->
    <button class="btn btn-sm btn-danger" id="delete_text_btn">Delete Text</button>
</div>
