{% load static %}
<div class="container-fluid py-2" id="hvac_editor" style="display:none;">

    <!-- type -->
    <div class="mb-2">
        <label for="type" class="form-label text-light" style="user-select:none;">Type</label>
        <input class="form-control" id="type" type="text" value="HVAC (PTAC)" readonly>
    </div>

    
    <!-- name -->
    <div class="mb-2">
        <label for="name" class="form-label text-light" style="user-select:none;">Name</label>
        <input class="form-control" id="name" type="text">
    </div>

    
    <!-- visible -->
    <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="visible">
        <label class="form-check-label text-light" for="visible" style="user-select:none;">Visible</label>
    </div>


    
    <!-- delete button -->
    <button class="btn btn-sm btn-danger" id="delete_btn">Delete HVAC</button>
</div>
