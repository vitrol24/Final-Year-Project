{% extends "index/base.html" %}

{% block title %}ZEDT - SignUp{%endblock title %}

{% block content %}
    <div class="bg-light border container-fluid my-4 text-center" style="max-height:600px; max-width:500px;">
        <h1 class="fw-bolder">SIGNUP</h1>
        <form method="post" action="{% url 'user:signup' %}">
            {% csrf_token %}
            <div class="container-fluid my-2 text-start">
                <label for="firstname" class="form-label">Firstname</label>
                <input class="form-control" id="firstname" name="firstname" type="text" required>
            </div>
            <div class="container-fluid my-2 text-start">
                <label for="lastname" class="form-label">Lastname</label>
                <input class="form-control" id="lastname" name="lastname" type="text" required>
            </div>
            <div class="container-fluid my-2 text-start">
                <label for="email" class="form-label">Email</label>
                <input class="form-control" id="email" name="email" type="email" required>
            </div>
            <div class="container-fluid my-2 text-start">
                <label for="password" class="form-label">Password</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
                    
            <input class="btn btn-primary my-2" type="submit" value="SIGNUP">
        </form>
        <hr />
        <p>Already have an account? <a href="{% url 'user:login' %}">Login</a></p>
    </div>
{% endblock content %}
