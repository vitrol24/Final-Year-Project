{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="charset" content="utf-8">
        <title>ZEDT - Dashboard</title>
        <link href="{% static 'bootstrap-5.3.3/css/bootstrap.min.css' %}" rel="stylesheet" />
        <script src="{% static 'bootstrap-5.3.3/js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>
        <script src="{% static 'chart.umd.min.js' %}" type="text/javascript"></script>
    </head>
    <body>
        <nav class="border-bottom navbar navbar-expand-lg bg-body-tertiary rounded" aria-label="Eleventh navbar example">
            <div class="container-fluid">
                <a class="fw-bolder navbar-brand" href="#">{{user.first_name}} {{user.last_name}}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample09" aria-controls="navbarsExample09" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarsExample09">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="link-primary nav-link" aria-current="page" href="{% url 'user:dashboard' %}">Projects</a>
                        </li>
                        <li class="nav-item">
                            <a class="link-primary nav-link" href="{% url 'user:account' %}">Account</a>
                        </li>
                        <!--li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-expanded="false">Dropdown</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li-->
                    </ul>
                    <div>
                        <a class="btn btn-danger" href="{% url 'user:logout' %}">LOGOUT</a>
                    </div>
                    
                </div>
            </div>
        </nav>





        <main class="container-fluid">
            <!-- FLASH MESSAGES -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{message.tags}}{% endif %}  alert-dismissible  my-2" role="alert">
                        {{message}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- content -->
            {% block content %}{% endblock %}
        </main>
        
    </body>
</html>
